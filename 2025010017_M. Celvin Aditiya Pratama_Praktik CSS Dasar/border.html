<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border CSS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Praktik 12-13 - Border dan Border Radius</h1>

    <div class="box1">Solid - border-width 2px</div>
    <div class="box2">Dashed - border-width 3px</div>
    <div class="box3">Dotted - border-width 2px</div>

    <div class="kartu-radius">
        <h2>Profil</h2>
        <p>Informasi mahasiswa dengan border-radius 20px.</p>
    </div>

    <div class="radius-0">Radius 0px</div>
    <div class="radius-10">Radius 10px</div>
    <div class="radius-20">Radius 20px</div>
    <div class="radius-50">Radius 50px</div>
</body>
</html>
