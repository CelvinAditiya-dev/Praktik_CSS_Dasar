<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warna CSS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1 class="judul-warna">Praktik 7-8 - Warna CSS</h1>

    <section class="warna-satu">
        <h2>Bagian Satu</h2>
        <p>Warna teks menggunakan RGB dan background menggunakan HEX.</p>
    </section>

    <section class="warna-dua">
        <h2>Bagian Dua</h2>
        <p>Warna teks putih menggunakan RGB.</p>
    </section>

    <section class="warna-tiga">
        <h2>Bagian Tiga</h2>
        <p>Background berbeda agar teks tetap mudah dibaca.</p>
    </section>

    <div class="palet-warna">
        <p class="merah">Merah</p>
        <p class="hijau">Hijau</p>
        <p class="biru">Biru</p>
        <p class="oranye">Oranye</p>
        <p class="ungu">Ungu</p>
    </div>
</body>
</html>
